name: Rust verification
on:
  push:
    branches: [main]
    paths: &inputs
      - 'apps/**'
      - 'crates/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'plugins/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Cache Bun packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.3-${{ hashFiles('frontend/bun.lock') }}
          restore-keys: |
            bun-packages-${{ runner.os }}-${{ runner.arch }}-1.4.3-
      - name: Cache pip downloads
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/pip
          key: pip-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-${{ hashFiles('scripts/requirements.txt') }}
          restore-keys: |
            pip-${{ runner.os }}-${{ runner.arch }}-ubuntu24.04-
      - name: Read pinned Rust version
        id: toolchain
        run: |
          version=$(python3 -c 'import pathlib,tomllib; print(tomllib.loads(pathlib.Path("rust-toolchain.toml").read_text())["toolchain"]["channel"])')
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Cache Rust toolchain and target libraries
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.rustup/toolchains/${{ steps.toolchain.outputs.version }}-x86_64-unknown-linux-gnu
          key: toolchain-${{ runner.os }}-${{ runner.arch }}-gnu-musl-wasm-v1-${{ hashFiles('rust-toolchain.toml') }}
      - name: Build embedded Vue frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
      - name: Toolchain and build dependencies
        env:
          HYDRA_RUST_VERSION: ${{ steps.toolchain.outputs.version }}
        run: |
          rustup toolchain install "$HYDRA_RUST_VERSION" --profile minimal \
            --component rustfmt --component clippy \
            --target wasm32-unknown-unknown --target x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler musl-tools
          python3 -m pip install -r scripts/requirements.txt
      - name: Cache Cargo dependencies and compiled targets
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: |
            . -> target
            plugins/examples/length-prefixed -> target
          # Covers native debug/release, musl release and the WASM sample.
          cache-targets: true
          cache-on-failure: true
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all -- --check
      - run: python3 tests/compatibility/frontend_build.py
      - run: python3 tests/compatibility/installer.py
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: scripts/check-contracts.sh
      - run: python3 scripts/generate-frontend.py --check
      - run: cargo build --locked --workspace
      - run: python3 tests/e2e/relay.py
      - run: python3 tests/e2e/proxy_runtime.py
      - run: python3 tests/e2e/udp_history.py
      - run: python3 tests/e2e/forwarding.py
      - run: cargo build --locked --release --manifest-path plugins/examples/length-prefixed/Cargo.toml --target wasm32-unknown-unknown
      - run: python3 tests/e2e/http_filters.py
        env:
          HYDRA_WASM_SAMPLE: ${{ github.workspace }}/plugins/examples/length-prefixed/target/wasm32-unknown-unknown/release/hydra_length_prefixed_example.wasm
      - name: Install pinned uv for submitter acceptance
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
          # Runtime tests intentionally use private temporary uv caches, not
          # the global uv cache managed by setup-uv.
          enable-cache: false
      - run: python3 tests/e2e/flags_controls.py
      - run: python3 tests/e2e/python_submitter.py
      - run: python3 tests/e2e/operations.py
      - run: python3 tests/e2e/diagnostics.py
      - name: Embedded Vue browser smoke
        run: |
          command -v google-chrome || command -v chromium
          python3 tests/e2e/browser.py
        env:
          HYDRA_VERIFY_EMBEDDED: "1"
      - run: cargo build --locked --release --workspace
      - name: Build static Linux binaries
        run: |
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --locked --release --target x86_64-unknown-linux-musl \
              --manifest-path Cargo.toml -p hydra-core -p hydra-proxy
          mkdir -p dist/linux-x86_64-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/hydra-core \
            dist/linux-x86_64-musl/hydra-core-linux-x86_64-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/hydra-proxy \
            dist/linux-x86_64-musl/hydra-proxy-linux-x86_64-musl
          for binary in dist/linux-x86_64-musl/hydra-*-linux-x86_64-musl; do
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "Expected a static binary, but found an ELF interpreter: $binary" >&2
              exit 1
            fi
          done
          printf 'commit=%s\ntarget=%s\n' "$GITHUB_SHA" "x86_64-unknown-linux-musl" \
            > dist/linux-x86_64-musl/BUILD.txt
          (cd dist/linux-x86_64-musl && sha256sum hydra-*-linux-x86_64-musl > SHA256SUMS)
          tar -czf "$GITHUB_WORKSPACE/dist/hydra-linux-x86_64-musl.tar.gz" \
            -C "$GITHUB_WORKSPACE/dist/linux-x86_64-musl" .
      - name: Upload downloadable Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: hydra-linux-x86_64-musl-${{ github.sha }}
          path: dist/hydra-linux-x86_64-musl.tar.gz
          if-no-files-found: error
          retention-days: 30
  publish-s3:
    name: Publish latest Linux binaries to S3
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && vars.HYDRA_PUBLISH_S3 == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
    concurrency:
      group: hydra-s3-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download this verified build
        uses: actions/download-artifact@v4
        with:
          name: hydra-linux-x86_64-musl-${{ github.sha }}
          path: ${{ runner.temp }}/hydra-linux-artifact
      - name: Skip superseded builds
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          else
            echo 'Skipping a build superseded on main.'
          fi
      - name: Replace Core and Proxy in S3
        if: steps.latest.outputs.publish == 'true'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.HYDRA_S3_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.HYDRA_S3_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.HYDRA_S3_REGION }}
          HYDRA_S3_ENDPOINT: ${{ secrets.HYDRA_S3_ENDPOINT }}
          HYDRA_S3_BUCKET: ${{ secrets.HYDRA_S3_BUCKET }}
        run: scripts/publish-s3.sh "$RUNNER_TEMP/hydra-linux-artifact/hydra-linux-x86_64-musl.tar.gz"

  publish-github-release:
    name: Publish public GitHub install archive
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      actions: read
    concurrency:
      group: hydra-github-latest
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Download this verified build
        uses: actions/download-artifact@v4
        with:
          name: hydra-linux-x86_64-musl-${{ github.sha }}
          path: ${{ runner.temp }}/hydra-linux-artifact
      - name: Skip superseded builds
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/main" --jq .object.sha)
          if [[ "$current" == "$GITHUB_SHA" ]]; then
            echo 'publish=true' >> "$GITHUB_OUTPUT"
          fi
      - name: Replace public latest release
        if: steps.latest.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete hydra-latest --yes --cleanup-tag || true
          git tag -f hydra-latest "$GITHUB_SHA"
          git push --force origin refs/tags/hydra-latest
          gh release create hydra-latest \
            "$RUNNER_TEMP/hydra-linux-artifact/hydra-linux-x86_64-musl.tar.gz" \
            --title "Hydra latest ($GITHUB_SHA)" --notes "Verified full Hydra x86_64 Linux build from $GITHUB_SHA." --latest
