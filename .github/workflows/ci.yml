name: Rust verification
on:
  push:
    branches: [main]
    paths: &inputs
      - 'apps/**'
      - 'crates/**'
      - 'contracts/**'
      - 'frontend/**'
      - 'plugins/**'
      - 'migrations/**'
      - 'tests/**'
      - 'scripts/**'
      - 'Cargo.*'
      - 'rust-toolchain.toml'
      - '.cargo/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths: *inputs
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.3
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.3
      - name: Build embedded Vue frontend
        working-directory: frontend
        run: |
          bun install --frozen-lockfile
          bun run typecheck
          bun run test
          bun run build
      - name: Toolchain and protobuf
        run: |
          rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
          sudo apt-get update
          sudo apt-get install -y protobuf-compiler
          rustup target add wasm32-unknown-unknown --toolchain 1.99.0
          python3 -m pip install -r scripts/requirements.txt
      - run: cargo fmt --all -- --check
      - run: python3 tests/compatibility/frontend_build.py
      - run: cargo check --locked --workspace --all-targets
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - run: cargo test --locked --workspace
      - run: scripts/check-contracts.sh
      - run: python3 scripts/generate-frontend.py --check
      - run: cargo build --locked --workspace
      - run: python3 tests/e2e/relay.py
      - run: python3 tests/e2e/proxy_runtime.py
      - run: cargo build --locked --release --manifest-path plugins/examples/length-prefixed/Cargo.toml --target wasm32-unknown-unknown
      - run: python3 tests/e2e/http_filters.py
        env:
          HYDRA_WASM_SAMPLE: ${{ github.workspace }}/plugins/examples/length-prefixed/target/wasm32-unknown-unknown/release/hydra_length_prefixed_example.wasm
      - name: Install pinned uv for submitter acceptance
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.10.9"
          enable-cache: false
      - run: python3 tests/e2e/flags_controls.py
      - run: python3 tests/e2e/python_submitter.py
      - run: python3 tests/e2e/operations.py
      - run: python3 tests/e2e/diagnostics.py
      - name: Embedded Vue browser smoke
        run: |
          command -v google-chrome || command -v chromium
          python3 tests/e2e/browser.py
        env:
          HYDRA_VERIFY_EMBEDDED: "1"
      - run: cargo build --locked --release --workspace
      - name: Build static Linux binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
          rustup target add x86_64-unknown-linux-musl --toolchain 1.99.0
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
          CC_x86_64_unknown_linux_musl=musl-gcc \
            cargo build --locked --release --target x86_64-unknown-linux-musl \
              --manifest-path Cargo.toml -p hydra-core -p hydra-proxy
          mkdir -p dist/linux-x86_64-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/hydra-core \
            dist/linux-x86_64-musl/hydra-core-linux-x86_64-musl
          install -m 0755 target/x86_64-unknown-linux-musl/release/hydra-proxy \
            dist/linux-x86_64-musl/hydra-proxy-linux-x86_64-musl
          for binary in dist/linux-x86_64-musl/hydra-*-linux-x86_64-musl; do
            if readelf -l "$binary" | grep -q 'INTERP'; then
              echo "Expected a static binary, but found an ELF interpreter: $binary" >&2
              exit 1
            fi
          done
          printf 'commit=%s\ntarget=%s\n' "$GITHUB_SHA" "x86_64-unknown-linux-musl" \
            > dist/linux-x86_64-musl/BUILD.txt
          (cd dist/linux-x86_64-musl && sha256sum hydra-*-linux-x86_64-musl > SHA256SUMS)
          tar -czf "$GITHUB_WORKSPACE/dist/hydra-linux-x86_64-musl.tar.gz" \
            -C "$GITHUB_WORKSPACE/dist/linux-x86_64-musl" .
      - name: Upload downloadable Linux binaries
        uses: actions/upload-artifact@v4
        with:
          name: hydra-linux-x86_64-musl-${{ github.sha }}
          path: dist/hydra-linux-x86_64-musl.tar.gz
          if-no-files-found: error
          retention-days: 30
