components:
  schemas:
    Activation:
      type: object
      required:
      - service_id
      properties:
        service_id:
          type: string
      additionalProperties: false
    Actor:
      type: object
      required:
      - kind
      - id
      properties:
        id:
          type: string
        kind:
          type: string
    AuditEvent:
      type: object
      required:
      - id
      - at
      - actor_kind
      - actor_id
      - action
      - target
      - request_id
      - success
      - metadata
      properties:
        action:
          type: string
        actor_id:
          type: string
        actor_kind:
          type: string
        at:
          type: string
        id:
          type: integer
          format: int64
        metadata:
          type: string
        request_id:
          type: string
        success:
          type: boolean
        target:
          type: string
    BulkStateInput:
      type: object
      required:
      - expected_revision
      - ids
      - enabled
      properties:
        enabled:
          type: boolean
        expected_revision:
          type: integer
          format: int64
          minimum: 0
        ids:
          type: array
          items:
            type: string
      additionalProperties: false
    Capture:
      type: object
      required:
      - sample_id
      properties:
        sample_id:
          type: string
    CheckerConfig:
      oneOf:
      - type: object
        required:
        - address
        - host
        - path
        - bearer
        - kind
        properties:
          address:
            type: string
          bearer:
            $ref: '#/components/schemas/SecretUpdate'
          credential_configured:
            type: boolean
          host:
            type: string
          kind:
            type: string
            enum:
            - http
          path:
            type: string
      - type: object
        required:
        - address
        - host
        - path
        - bearer
        - kind
        properties:
          address:
            type: string
          bearer:
            $ref: '#/components/schemas/SecretUpdate'
          ca_certificate_der:
            type: array
            items:
              type: integer
              format: int32
              minimum: 0
          ca_certificate_path:
            type:
            - string
            - 'null'
          credential_configured:
            type: boolean
          host:
            type: string
          kind:
            type: string
            enum:
            - https
          path:
            type: string
      - type: object
        required:
        - address
        - secret
        - kind
        properties:
          address:
            type: string
          credential_configured:
            type: boolean
          kind:
            type: string
            enum:
            - tcp
          secret:
            $ref: '#/components/schemas/SecretUpdate'
      - type: object
        required:
        - address
        - request_template
        - accepted_prefix
        - secret
        - batch_size
        - kind
        properties:
          accepted_prefix:
            type: string
          address:
            type: string
          batch_size:
            type: integer
            minimum: 0
          credential_configured:
            type: boolean
          kind:
            type: string
            enum:
            - custom_tcp
          request_template:
            type: string
          secret:
            $ref: '#/components/schemas/SecretUpdate'
    CreateUser:
      type: object
      required:
      - username
      - password
      properties:
        password:
          type: string
          description: Password length is measured in UTF-8 bytes and must be 12..1024.
        username:
          type: string
      additionalProperties: false
    EditableConfig:
      type: object
      required:
      - auto_submit_captured
      - execution_mode
      properties:
        auto_submit_captured:
          type: boolean
        checker:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/CheckerConfig'
        execution_mode:
          $ref: '#/components/schemas/ExecutionMode'
        flag_pattern:
          type:
          - string
          - 'null'
        host_runtime:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/HostRuntimeSettings'
        sandbox:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/SandboxSettings'
        traffic_history_compression_level:
          type: integer
          format: int32
        traffic_history_per_service_mib:
          type: integer
          format: int32
          minimum: 0
      additionalProperties: false
    EffectivenessCell:
      type: object
      required:
      - exploit_id
      - team_key
      - runs
      - target_attempts
      - new_flags
      - duplicate_flags
      - accepted_flags
      - flag_counts_complete
      properties:
        accepted_flags:
          type: integer
          format: int32
          description: Accepted flags credited exclusively to their original run and target.
          minimum: 0
        duplicate_flags:
          type: integer
          format: int32
          minimum: 0
        exploit_id:
          type: string
        flag_counts_complete:
          type: boolean
        last_accepted_capture_at:
          type:
          - integer
          - 'null'
          format: int64
          description: Capture time of the most recent originally captured flag now accepted.
        latest:
          oneOf:
          - type: 'null'
          - $ref: '#/components/schemas/EffectivenessLatestRun'
        new_flags:
          type: integer
          format: int32
          minimum: 0
        runs:
          type: integer
          format: int32
          minimum: 0
        service_id:
          type:
          - string
          - 'null'
        target_attempts:
          type: integer
          format: int32
          description: Recorded target attempts; excludes shared batch processes and unknown legacy attempts.
          minimum: 0
        team_key:
          type: string
    EffectivenessLatestRun:
      type: object
      required:
      - id
      - status
      - mode
      - created_at
      properties:
        created_at:
          type: integer
          format: int64
        exit_code:
          type:
          - integer
          - 'null'
          format: int32
        finished_at:
          type:
          - integer
          - 'null'
          format: int64
        id:
          type: string
        mode:
          type: string
        process_exit_code:
          type:
          - integer
          - 'null'
