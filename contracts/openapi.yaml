openapi: 3.1.0
info:
  title: Hydra Core REST API
  description: Authenticated Hydra control plane. Documentation is served only on trusted loopback management interface.
  version: 0.1.0
paths:
  /api/v1/audit:
    get:
      tags:
      - audit
      operationId: audit_events
      parameters:
      - name: after
        in: query
        description: Exclusive event ID cursor
        required: false
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEvent'
        '401':
          description: ''
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: ''
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      parameters:
      - name: X-CSRF-Token
        in: header
        description: Value of hydra_csrf cookie; access bearer and refresh cookie must identify the same session
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '401':
          description: ''
  /api/v1/auth/me:
    get:
      tags:
      - auth
      operationId: me
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Actor'
        '401':
          description: ''
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refresh
      parameters:
      - name: X-CSRF-Token
        in: header
        description: Value of the root-scoped hydra_csrf cookie
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: ''
      security: []
  /api/v1/auth/sessions:
