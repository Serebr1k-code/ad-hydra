  /api/v1/traffic/events/stream:
    get:
      tags:
      - traffic
      operationId: stream
      responses:
        '200':
          description: Bounded parsed SSE; closes on access expiry
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          description: ''
  /api/v1/traffic/flows:
    get:
      tags:
      - traffic
      operationId: flows
      parameters:
      - name: after
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: newest_first
        in: query
        description: Descending ingestion order with an exclusive older-than cursor; default remains oldest-first.
        required: false
        schema:
          type: boolean
      - name: service_id
        in: query
        required: false
        schema:
          type: string
      - name: client_ip
        in: query
        required: false
        schema:
          type: string
      - name: since_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: until_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: transport
        in: query
        description: 1 = TCP, 2 = UDP.
        required: false
        schema:
          type: integer
          format: int32
      - name: source_ip
        in: query
        description: Opening flow client endpoint; independent of message direction.
        required: false
        schema:
          type: string
      - name: destination_ip
        in: query
        description: Opening flow upstream endpoint.
        required: false
        schema:
          type: string
      - name: direction
        in: query
        description: 1 = client to server, 2 = server to client.
        required: false
        schema:
          type: integer
          format: int32
      - name: field_path
        in: query
        description: Exact parser field identifier (for example http.path).
        required: false
        schema:
          type: string
      - name: field_value
        in: query
        description: Exact scalar text value; requires field_path.
        required: false
        schema:
          type: string
      - name: matched_rule
        in: query
        required: false
        schema:
          type: string
      - name: has_flag
        in: query
        description: Matches durable critical finding provenance without returning flag values.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          description: ''
  /api/v1/traffic/flows/{id}:
