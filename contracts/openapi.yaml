                $ref: '#/components/schemas/Capture'
        '404':
          description: ''
        '503':
          description: ''
  /api/v1/traffic/flows/{id}/history:
    get:
      tags:
      - traffic
      operationId: flow_history
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FlowHistory'
        '401':
          description: ''
        '404':
          description: ''
        '409':
          description: Flow is active or history is still being saved
        '503':
          description: ''
  /api/v1/traffic/flows/{id}/messages:
    get:
      tags:
      - traffic
      operationId: messages
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: after
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
      - name: newest_first
        in: query
        description: Descending ingestion order with an exclusive older-than cursor; default remains oldest-first.
        required: false
        schema:
          type: boolean
      - name: service_id
        in: query
        required: false
        schema:
          type: string
      - name: client_ip
        in: query
        required: false
        schema:
          type: string
      - name: since_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: until_ms
        in: query
        required: false
        schema:
          type: integer
          format: int64
      - name: transport
        in: query
        description: 1 = TCP, 2 = UDP.
        required: false
        schema:
          type: integer
          format: int32
      - name: source_ip
        in: query
        description: Opening flow client endpoint; independent of message direction.
        required: false
        schema:
          type: string
      - name: destination_ip
        in: query
        description: Opening flow upstream endpoint.
        required: false
        schema:
          type: string
      - name: direction
        in: query
        description: 1 = client to server, 2 = server to client.
        required: false
        schema:
          type: integer
          format: int32
      - name: field_path
        in: query
        description: Exact parser field identifier (for example http.path).
        required: false
        schema:
          type: string
      - name: field_value
        in: query
        description: Exact scalar text value; requires field_path.
        required: false
        schema:
          type: string
      - name: matched_rule
        in: query
        required: false
        schema:
          type: string
      - name: has_flag
        in: query
        description: Matches durable critical finding provenance without returning flag values.
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Page'
        '401':
          description: ''
  /api/v1/traffic/messages/{id}:
    get:
      tags:
      - traffic
      operationId: message
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
        '404':
          description: ''
  /api/v1/traffic/samples/{id}:
    get:
      tags:
      - traffic
      operationId: sample
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sample'
        '410':
          description: Sample expired, not yet captured, or unavailable
        '503':
          description: ''
  /api/v1/users:
    get:
      tags:
      - users
      operationId: list_users
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/User'
        '401':
          description: ''
  /api/v1/users/{id}:
    patch:
      tags:
      - users
      operationId: update_user
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateUser'
        required: true
      responses:
        '204':
          description: ''
        '400':
          description: ''
        '401':
          description: ''
        '409':
          description: ''
  /api/v1/users/{id}/deactivate:
    post:
      tags:
      - users
      operationId: deactivate
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '204':
          description: ''
        '401':
          description: ''
components:
  schemas:
    Activation:
