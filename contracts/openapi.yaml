      operationId: delete_exploit
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: revision
        in: query
        required: true
        schema:
          type: integer
          format: int64
      responses:
        '200':
          description: ''
  /api/v1/farm/exploits/{id}/versions:
    get:
      tags:
