          application/json:
            schema:
              $ref: '#/components/schemas/ServiceProbeInput'
        required: true
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProbeOutput'
        '400':
          description: ''
        '503':
          description: ''
  /api/v1/farm/exploits:
