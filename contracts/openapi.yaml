      operationId: effectiveness
      parameters:
      - name: service_id
        in: query
        description: Farm service ID; empty selects legacy targets
        required: false
        schema:
          type: string
      - name: window
        in: query
        description: 1h, 24h (default), 7d, or retained; filters run creation time
        required: false
        schema:
          type: string
      - name: row_offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      - name: team_offset
        in: query
        required: false
        schema:
          type: integer
          format: int32
          minimum: 0
      responses:
