openapi: 3.1.0
info:
  title: Hydra Core REST API
  version: 1.1.0-draft
  description: All authenticated users have full permissions; there are no roles. Users are created only
    via the hydra-core CLI. Internal proxy RPCs are specified separately in hydra/proxy/v1/proxy.proto.
servers:
- url: /
tags:
- name: Auth
- name: Users
- name: Services
- name: Filters
- name: Traffic
- name: Protocols
- name: Targets
- name: Farm
- name: Flags
- name: Audit
- name: Diagnostics
security:
- AccessJWT: []
paths:
  /api/v1/auth/login:
    post:
      tags:
      - Auth
      summary: Login
      operationId: post_api_v1_auth_login
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      description: Returns access token; sets HttpOnly Secure SameSite=Strict refresh cookie and CSRF
        cookie. No public registration.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      security: []
  /api/v1/auth/refresh:
    post:
      tags:
      - Auth
      summary: Rotate refresh JWT and issue 60s access JWT
      operationId: post_api_v1_auth_refresh
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      description: Requires signed refresh JWT in HttpOnly cookie, matching CSRF header/cookie and valid
        Origin. Refresh expires at the original login+10h, not sliding.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - Auth
      summary: Revoke current session and clear refresh cookie
      operationId: post_api_v1_auth_logout
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      description: Requires access JWT and refresh CSRF; revokes session and clears cookie.
      parameters:
      - name: X-CSRF-Token
        in: header
        required: true
        schema:
          type: string
  /api/v1/auth/me:
    get:
      tags:
      - Auth
      summary: Get current user
      operationId: get_api_v1_auth_me
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
  /api/v1/auth/sessions:
    get:
      tags:
      - Auth
      summary: List my sessions
      operationId: get_api_v1_auth_sessions
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Session'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
  /api/v1/auth/sessions/{session_id}:
    delete:
      tags:
      - Auth
      summary: Revoke my session
      operationId: delete_api_v1_auth_sessions_session_id
      responses:
        '204':
          description: No Content
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/session_id'
  /api/v1/users:
    get:
      tags:
      - Users
      summary: List users (creation via CLI only)
      operationId: get_api_v1_users
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/User'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
  /api/v1/users/{user_id}:
    patch:
      tags:
      - Users
      summary: Enable or disable user account
      operationId: patch_api_v1_users_user_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      parameters:
      - $ref: '#/components/parameters/user_id'
  /api/v1/services:
    get:
      tags:
      - Services
      summary: List proxied services
      operationId: get_api_v1_services
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Service'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
    post:
      tags:
      - Services
      summary: Create proxied service
      operationId: post_api_v1_services
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
  /api/v1/services/{service_id}:
    get:
      tags:
      - Services
      summary: Get service
      operationId: get_api_v1_services_service_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/service_id'
    patch:
      tags:
      - Services
      summary: Update service
      operationId: patch_api_v1_services_service_id
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Service'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServiceInput'
      parameters:
      - $ref: '#/components/parameters/service_id'
    delete:
      tags:
      - Services
      summary: Remove service
      operationId: delete_api_v1_services_service_id
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/service_id'
  /api/v1/filters:
    get:
      tags:
      - Filters
      summary: List filters sorted by date / service
      operationId: get_api_v1_filters
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Filter'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - name: service_id
        in: query
        required: false
        schema:
          type: string
      - name: enabled
        in: query
        required: false
        schema:
          type: boolean
      - &id001
        name: cursor
        in: query
        required: false
        schema:
          type: string
        description: Opaque pagination cursor.
      - &id002
        name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 50
    post:
      tags:
      - Filters
      summary: Create filter
      operationId: post_api_v1_filters
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterInput'
  /api/v1/filters/{filter_id}:
    get:
      tags:
      - Filters
      summary: Get filter and applied state
      operationId: get_api_v1_filters_filter_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/filter_id'
    patch:
      tags:
      - Filters
      summary: Modify filter and increment revision
      operationId: patch_api_v1_filters_filter_id
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterInput'
      parameters:
      - $ref: '#/components/parameters/filter_id'
    delete:
      tags:
      - Filters
      summary: Delete filter
      operationId: delete_api_v1_filters_filter_id
      responses:
        '202':
          description: Accepted
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/filter_id'
  /api/v1/filters/{filter_id}/state:
    put:
      tags:
      - Filters
      summary: Enable or disable a filter
      operationId: put_api_v1_filters_filter_id_state
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Filter'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      description: Returns pending state until proxy confirms applied revision; expected_revision guards
        concurrent updates.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterStateChange'
      parameters:
      - $ref: '#/components/parameters/filter_id'
  /api/v1/filters/batch-state:
    post:
      tags:
      - Filters
      summary: Bulk enable/disable filters
      operationId: post_api_v1_filters_batch_state
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                type: object
                properties:
                  accepted_count:
                    type: integer
                  request_id:
                    type: string
                required:
                - accepted_count
                - request_id
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FilterBatchStateChange'
  /api/v1/traffic/flows:
    get:
      tags:
      - Traffic
      summary: List flows
      operationId: get_api_v1_traffic_flows
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Flow'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - name: service_id
        in: query
        required: false
        schema:
          type: string
      - name: from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: client_ip
        in: query
        required: false
        schema:
          type: string
      - *id001
      - *id002
  /api/v1/traffic/flows/{flow_id}:
    get:
      tags:
      - Traffic
      summary: Get flow details
      operationId: get_api_v1_traffic_flows_flow_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Flow'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/flow_id'
  /api/v1/traffic/flows/{flow_id}/messages:
    get:
      tags:
      - Traffic
      summary: Get parsed messages in flow
      operationId: get_api_v1_traffic_flows_flow_id_messages
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Message'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/flow_id'
      - *id001
      - *id002
  /api/v1/traffic/messages/{message_id}:
    get:
      tags:
      - Traffic
      summary: Get parsed message and fields
      operationId: get_api_v1_traffic_messages_message_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Message'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/message_id'
  /api/v1/traffic/samples/{sample_id}:
    get:
      tags:
      - Traffic
      summary: Fetch a bounded raw traffic sample on demand
      operationId: get_api_v1_traffic_samples_sample_id
      responses:
        '200':
          description: Raw byte sample
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '410':
          description: Sample expired or overwritten
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/sample_id'
  /api/v1/traffic/events/stream:
    get:
      tags:
      - Traffic
      summary: Live parsed events via SSE
      operationId: get_api_v1_traffic_events_stream
      responses:
        '200':
          description: text/event-stream carrying EventEnvelope JSON
          content:
            text/event-stream:
              schema:
                type: string
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      description: SSE does not expose raw packets. Access JWT must be in Authorization header, not URL.
  /api/v1/protocols:
    get:
      tags:
      - Protocols
      summary: List installed protocol plugins
      operationId: get_api_v1_protocols
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Protocol'
                  next_cursor:
                    type:
                    - string
                    - 'null'
                required:
                - items
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
    post:
      tags:
      - Protocols
      summary: Upload bounded Rust/WASM parser
      operationId: post_api_v1_protocols
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocol'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                plugin:
                  type: string
                  format: binary
                protocol_id:
                  type: string
                version:
                  type: string
              required:
              - plugin
              - protocol_id
              - version
              additionalProperties: false
  /api/v1/protocols/{protocol_id}:
    get:
      tags:
      - Protocols
      summary: Get protocol plugin details
      operationId: get_api_v1_protocols_protocol_id
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocol'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      parameters:
      - $ref: '#/components/parameters/protocol_id'
  /api/v1/protocols/{protocol_id}/activate:
    post:
      tags:
      - Protocols
      summary: Activate plugin on service
      operationId: post_api_v1_protocols_protocol_id_activate
      responses:
        '202':
          description: Accepted, proxy sync may still be pending
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Protocol'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
        '401':
          description: Missing/invalid access token
        '403':
          description: Forbidden by security policy (not role-based)
        '409':
          description: State/revision conflict
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProtocolActivation'
      parameters:
      - $ref: '#/components/parameters/protocol_id'
      - $ref: '#/components/parameters/IdempotencyKey'
  /api/v1/protocols/test:
    post:
      tags:
