components:
  securitySchemes:
    AccessJWT:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Access JWT valid for 60 seconds. Refresh JWT is an HttpOnly cookie only for refresh/logout
        endpoints.
  schemas:
    ApiError:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
        details:
          type: object
          properties: {}
          additionalProperties: true
      required:
      - code
      - message
      - request_id
    Actor:
      type: object
      properties:
        type:
          type: string
          enum:
          - user
          - system
          - local_cli
          - service
        user_id:
          type: string
        username:
          type: string
        initiated_by_user_id:
          type: string
      required:
      - type
    AuditMeta:
      type: object
      properties:
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/Actor'
        updated_at:
          type: string
          format: date-time
        updated_by:
          $ref: '#/components/schemas/Actor'
      required:
      - created_at
      - created_by
      - updated_at
      - updated_by
    LoginRequest:
      type: object
      properties:
        username:
          type: string
        password:
          type: string
      required:
      - username
      - password
      additionalProperties: false
    TokenResponse:
      type: object
      properties:
        access_token:
          type: string
        token_type:
          type: string
          enum:
          - Bearer
        expires_in:
          type: integer
          const: 60
        session_id:
          type: string
          format: uuid
        session_expires_at:
          type: string
          format: date-time
        csrf_token:
          type: string
          description: Double-submit CSRF token; also sent in hydra_csrf cookie.
      required:
      - access_token
      - token_type
      - expires_in
      - session_id
      - session_expires_at
      - csrf_token
    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        username:
          type: string
        active:
          type: boolean
        created_at:
          type: string
          format: date-time
        created_by:
          $ref: '#/components/schemas/Actor'
      required:
      - id
      - username
      - active
      - created_at
      - created_by
    UserUpdate:
      type: object
      properties:
        active:
          type: boolean
      required:
      - active
      additionalProperties: false
    Session:
      type: object
      properties:
        id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
        revoked_at:
          type:
          - string
          - 'null'
          format: date-time
      required:
      - id
      - created_at
      - expires_at
    ServiceInput:
      type: object
      properties:
        name: &id003
          type: string
        transport: &id004
          type: string
          enum:
          - tcp
          - udp
        listen_address: &id005
          type: string
        upstream_address: &id006
          type: string
        protocol_id: &id007
          type: string
        enabled: &id008
          type: boolean
      required:
      - name
      - transport
      - listen_address
      - upstream_address
      additionalProperties: false
    Service:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name: *id003
        transport: *id004
        listen_address: *id005
        upstream_address: *id006
        protocol_id: *id007
        enabled: *id008
        revision:
          type: integer
        apply_status:
          type: string
          enum:
          - pending
          - applied
          - failed
        audit:
          $ref: '#/components/schemas/AuditMeta'
      required:
      - id
      - name
      - transport
      - listen_address
      - upstream_address
      - enabled
      - revision
      - apply_status
      - audit
    RuleExpression:
      description: Recursive AND/OR/NOT/predicate expression. Shape is validated by Core and bounded in
        complexity.
      oneOf:
      - type: object
        properties:
          all:
            type: array
            items:
              $ref: '#/components/schemas/RuleExpression'
        required:
        - all
        additionalProperties: false
      - type: object
        properties:
          any:
            type: array
            items:
              $ref: '#/components/schemas/RuleExpression'
        required:
        - any
        additionalProperties: false
      - type: object
        properties:
          not:
            $ref: '#/components/schemas/RuleExpression'
        required:
        - not
        additionalProperties: false
      - type: object
        properties:
          field:
            type: string
          op:
            type: string
            enum:
            - eq
            - ne
            - contains
            - regex
            - prefix
            - gt
            - lt
            - in
            - not_in
          value: {}
        required:
        - field
        - op
        - value
        additionalProperties: false
    RateLimitOptions:
      type: object
      properties:
        key:
          type: string
          description: Counter key, e.g. network.src_ip
        requests:
          type: integer
          minimum: 1
        window_ms:
          type: integer
          minimum: 1
        on_exceed:
          type: string
          enum:
          - block
          - drop_connection
          - drop_datagram
      required:
      - key
      - requests
      - window_ms
      - on_exceed
      additionalProperties: false
    FilterActionConfig:
      type: object
      properties:
        http_status:
          type: integer
          minimum: 400
          maximum: 599
        rate_limit:
          $ref: '#/components/schemas/RateLimitOptions'
        tag:
          type: string
      additionalProperties: false
    FilterInput:
      type: object
      properties:
        name: &id009
          type: string
        description: &id010
          type: string
        service_id: &id011
          type: string
          format: uuid
        enabled: &id012
          type: boolean
        priority: &id013
          type: integer
        mode: &id014
          type: string
          enum:
          - shadow
          - enforce
        action: &id015
          type: string
          enum:
          - allow
          - alert
          - block
          - drop_connection
          - drop_datagram
          - rate_limit
          - tag
          - log
        action_config: &id016
          $ref: '#/components/schemas/FilterActionConfig'
        conditions: &id017
          $ref: '#/components/schemas/RuleExpression'
        expires_at: &id018
          type:
          - string
          - 'null'
          format: date-time
        backend: &id019
          type: string
          description: Optional backend abstraction; userspace in v1.
      required:
      - name
      - service_id
      - enabled
      - priority
      - mode
      - action
      - conditions
      additionalProperties: false
    Filter:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name: *id009
        description: *id010
        service_id: *id011
        enabled: *id012
        priority: *id013
        mode: *id014
        action: *id015
        action_config: *id016
        conditions: *id017
        expires_at: *id018
        backend: *id019
        desired_revision:
          type: integer
        applied_revision:
          type: integer
        applied_enabled:
          type: boolean
        apply_status:
          type: string
          enum:
          - pending
          - applied
